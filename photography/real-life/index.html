<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Explore Jaime Páramo's real-life photography gallery, dedicated to capturing unpredictable moments in nature, wildlife, and sports with detailed EXIF data.">
        <title>Real Life Gallery | JParamade</title>

        <link rel="icon" href="/assets/images/logo.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Montserrat:wght@400;600;900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <link rel="stylesheet" href="/style/main.css">
        <link rel="stylesheet" href="/style/gallery.css">
    </head>
    <body>
        <header class="header">
            <div class="header-inner">
                <a href="/" class="logo-container">
                    <span class="site-name"><b>JParamade</b></span>
                </a>

                <button class="hamburger" id="hamburger-btn" aria-label="Toggle Menu">
                    <i class="fas fa-bars"></i>
                </button>

                <nav class="nav" id="nav-menu">
                    <a href="/">Home</a>
                    <a href="/assets/files/CV_JaimeParamo.pdf" target="_blank">CV</a>
                    <a href="/portfolio">Portfolio</a>
                    <a href="/blog">Blog</a>
                    <a href="/photography" class="active">Photography</a>
                    <a href="/contact">Contact</a>
                </nav>
            </div>
        </header>

        <main class="gallery-page fade-in-up">
            <header class="gallery-header">
                <a href="/photography" class="back-link"><i class="fas fa-arrow-left"></i> Back to Galleries</a>
                <h1 class="page-title">Real Life <span class="highlight">Photography</span></h1>
            </header>

            <nav class="gallery-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="nature">Nature & Wildlife</button>
                <button class="filter-btn" data-filter="sports">Sports</button>
            </nav>

            <div class="masonry-grid">
                <div class="masonry-item sports">
                    <img src="/assets/images/photography/real-life/helmet-backpack.webp" alt="Helmet & Backpack">

                    <div class="photo-overlay">
                        <i class="fas fa-expand"></i>
                    </div>

                    <div class="photo-meta-data" style="display: none;" 
                         data-camera="Olympus E-510"
                         data-lens="135mm"
                         data-aperture="f/5.3"
                         data-shutter="1/800s"
                         data-iso="ISO 100">
                    </div>
                </div>
                
                <div class="masonry-item nature">
                    <img src="/assets/images/photography/real-life/orange-cat.webp" alt="Orange Cat">

                    <div class="photo-overlay">
                        <i class="fas fa-expand"></i>
                    </div>

                    <div class="photo-meta-data" style="display: none;" 
                         data-camera="Canon EOS R6 Mark II"
                         data-lens="105mm"
                         data-aperture="f/7.1"
                         data-shutter="1/800s"
                         data-iso="ISO 800">
                    </div>
                </div>
                
                <div class="masonry-item nature">
                    <img src="/assets/images/photography/real-life/peacock.webp" alt="Peacock">

                    <div class="photo-overlay">
                        <i class="fas fa-expand"></i>
                    </div>

                    <div class="photo-meta-data" style="display: none;" 
                         data-camera="Canon EOS R6 Mark II"
                         data-lens="97mm"
                         data-aperture="f/7.1"
                         data-shutter="1/250s"
                         data-iso="ISO 1000">
                    </div>
                </div>
                
                <div class="masonry-item nature">
                    <img src="/assets/images/photography/real-life/black-orange-cat.webp" alt="Black & Orange Cat">

                    <div class="photo-overlay">
                        <i class="fas fa-expand"></i>
                    </div>

                    <div class="photo-meta-data" style="display: none;" 
                         data-camera="Canon EOS R6 Mark II"
                         data-lens="97mm"
                         data-aperture="f/7.1"
                         data-shutter="1/250s"
                         data-iso="ISO 640">
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 Jaime Páramo. All rights reserved.</p>
        </footer>
        
        <div class="lightbox" id="photo-lightbox">
            <button class="lightbox-close" aria-label="Close image"><i class="fas fa-times"></i></button>

            <div class="lightbox-content meta-image-content">
                <div class="lightbox-img-wrapper">
                    <img src="/" alt="" class="lightbox-img" id="lightbox-main-img">
                </div>

                <div class="lightbox-sidebar">
                    <div class="meta-header">
                        <i class="fas fa-camera-retro"></i>
                        <h3>EXIF Data</h3>
                    </div>
                    <div class="meta-list">
                        <p><i class="fas fa-camera"></i> <span id="lb-camera">Camera</span></p>
                        <p><i class="fas fa-dot-circle"></i> <span id="lb-lens">Lens</span></p>
                        <p><i class="fas fa-adjust"></i> <span id="lb-aperture">Aperture</span></p>
                        <p><i class="fas fa-stopwatch"></i> <span id="lb-shutter">Shutter</span></p>
                        <p><i class="fas fa-sun"></i> <span id="lb-iso">ISO</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="floating-social">
            <a href="https://github.com/JParamade" target="_blank" class="social-btn github" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://JParamade.itch.io" target="_blank" class="social-btn itch" aria-label="Itch.io">
                <img src="https://static.itch.io/images/itchio-textless-black.svg" alt="itch icon">
            </a>
            <a href="https://www.linkedin.com/in/jaime-paramo" target="_blank" class="social-btn linkedin" aria-label="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
            </a>
            <a href="mailto:jaime.paramo@outlook.com" class="social-btn mail" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
        </div>
        
        <script src="/scripts/main.js"></script>
        <script src="/scripts/photography.js"></script>
    </body>
</html>
